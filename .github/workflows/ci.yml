name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  DATABASE_URL: postgresql://marketwind:marketwind@localhost:5432/marketwind
  REDIS_URL: redis://localhost:6379/0

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marketwind
          POSTGRES_PASSWORD: marketwind
          POSTGRES_DB: marketwind
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U marketwind -d marketwind"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Run migrations
        run: python -m marketwind.storage.migrate

      - name: Run tests
        run: pytest -m "not live" -v
