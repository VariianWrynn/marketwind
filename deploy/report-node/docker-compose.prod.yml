# Production overrides for the Aliyun report node. Apply on top of the base compose:
#   docker compose -f docker-compose.yml -f deploy/report-node/docker-compose.prod.yml up -d --build
# Base docker-compose.yml is unchanged (it serves local dev verbatim).
services:
  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  app:
    restart: unless-stopped

  scheduler:
    # Cron is wall-clock; the cloud box must run Asia/Shanghai or reports fire 8h off.
    environment:
      TZ: Asia/Shanghai
    # WeChat delivery reuses the HOST's git-installed hermes venv (py3.11) in-container
    # (ADR-0001). The base compose already mounts ~/.hermes (creds + the venv itself) and
    # passes HERMES_BIN. But the venv's interpreter is a uv-managed standalone python that
    # lives OUTSIDE ~/.hermes, so its shebang breaks in-container unless we mount that dir
    # too. Point HERMES_BIN at the venv entrypoint in .env. See README "WeChat delivery".
    volumes:
      - ${HERMES_UV_PYTHON_DIR:-/root/.local/share/uv/python/cpython-3.11-linux-x86_64-gnu}:${HERMES_UV_PYTHON_DIR:-/root/.local/share/uv/python/cpython-3.11-linux-x86_64-gnu}:ro

  backup:
    build:
      context: deploy/report-node
    environment:
      DATABASE_URL: postgresql://marketwind:marketwind@postgres:5432/marketwind
      OSS_BUCKET: ${OSS_BUCKET:?set OSS_BUCKET in .env}
      OSSUTIL_AUTH_ARGS: ${OSSUTIL_AUTH_ARGS:-}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BARK_BASE_URL: ${BARK_BASE_URL:-}
      BARK_KEY: ${BARK_KEY:-}
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
