services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marketwind
      POSTGRES_PASSWORD: marketwind
      POSTGRES_DB: marketwind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketwind -d marketwind"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies migrations/*.sql and exits; app and scheduler will not start until it
  # exits 0 (ADR-0004). The runner fails loud if it finds no migration files, so a
  # clean exit really does mean "schema applied".
  # REDIS_URL is NOT optional here even though migration never touches Redis:
  # config.py instantiates Settings() at import time and redis_url has no default,
  # so without it this container dies in validation and nothing downstream ever starts.
  migrate:
    build: .
    command: ["python", "-m", "marketwind.storage.migrate"]
    environment:
      DATABASE_URL: postgresql://marketwind:marketwind@postgres:5432/marketwind
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://marketwind:marketwind@postgres:5432/marketwind
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    # /health returns 200 only when Postgres AND Redis are reachable, 503 otherwise,
    # and urlopen raises on 503 — so the exit code falls out with no extra logic.
    # Must be stdlib python: python:3.11-slim ships neither curl nor wget.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # scheduler — restart-durable autonomous daemon (pre-market + 07:00 cron).
  # Default: in-container send; requires `hermes` CLI on image PATH + ro creds mount below.
  # Fallback (Windows Docker Desktop if hermes won't containerize):
  #   run as HOST process: PYTHONPATH=. .venv/Scripts/python.exe -m marketwind.scheduling --scheduler
  #   point DATABASE_URL at localhost:5432 (published port); host hermes already logged in.
  # Final verdict (in-container vs host) deferred to smoke Stage 3 (owner-run, live).
  scheduler:
    build: .
    command: ["python", "-m", "marketwind.scheduling", "--scheduler"]
    environment:
      DATABASE_URL: postgresql://marketwind:marketwind@postgres:5432/marketwind
      REDIS_URL: redis://redis:6379/0
      IM_CHANNEL: hermes_weixin
      HERMES_BIN: ${HERMES_BIN:-hermes}
      WEIXIN_TARGET: ${WEIXIN_TARGET:-weixin}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      BOCHA_API_KEY: ${BOCHA_API_KEY:-}
      REPORT_DEV_LABEL: ${REPORT_DEV_LABEL:-true}
      HEALTHCHECK_URL_PREMARKET: ${HEALTHCHECK_URL_PREMARKET:-}
      HEALTHCHECK_URL_MAIN: ${HEALTHCHECK_URL_MAIN:-}
    volumes:
      - ${HERMES_HOST_DIR:-./hermes-creds}:/root/.hermes:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

# Named so `docker compose down` is survivable. Redis deliberately gets no volume:
# nothing durable is stored there, and adding one would imply a guarantee we don't rely on.
volumes:
  pgdata:
