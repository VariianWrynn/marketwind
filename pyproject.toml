[project]
name = "marketwind"
version = "0.0.0"
description = "STAR50 source-traceable financial morning-report agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "asyncpg>=0.30",
    "redis>=5.2",
    "apscheduler>=3.11",
    "akshare>=1.16",
    "langgraph>=0.3",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "trafilatura>=2.0",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "sqlfluff>=3.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["marketwind*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
